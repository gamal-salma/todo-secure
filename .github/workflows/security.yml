name: DevSecOps Security Pipeline

# Pipeline de seguridad "shift-left" del to-do (Unidad 3 - DevSecOps).
# Integra como codigo las puertas (quality gates) de seguridad que se ejecutan
# en cada push/PR. Cada job representa una tecnica distinta:
#   SCA -> SAST -> Secretos -> Contenedor/IaC -> DAST.
# Si una puerta critica falla, el pipeline se rompe (build-breaking).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # para subir resultados SARIF a "Code scanning"

jobs:
  # ---------------------------------------------------------------------------
  # 1) SCA - Software Composition Analysis (dependencias vulnerables)
  # ---------------------------------------------------------------------------
  sca:
    name: SCA - dependencias (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Auditoria de dependencias (rompe si HIGH/CRITICAL)
        run: npm audit --omit=dev --audit-level=high
      - name: Generar SBOM (CycloneDX) como artefacto de procedencia
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cyclonedx.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2) SAST - analisis estatico del codigo (Semgrep)
  # ---------------------------------------------------------------------------
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep (reglas OWASP/Node + reglas propias del proyecto)
        # Modo informe: los hallazgos se publican en "Code scanning" (SARIF) para su
        # triaje; no rompe el build por findings informativos. Las puertas que SI
        # rompen son SCA (npm audit) y el escaneo del contenedor (Trivy).
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/nodejs \
            --config security/semgrep-todo.yml \
            --sarif --output semgrep.sarif src/
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ---------------------------------------------------------------------------
  # 3) Escaneo de SECRETOS (gitleaks)
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scanning - gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: security/.gitleaks.toml

  # ---------------------------------------------------------------------------
  # 4) Escaneo del CONTENEDOR y de la IaC (Trivy)
  # ---------------------------------------------------------------------------
  container:
    name: Contenedor/IaC - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t todo-secure:ci .
      - name: Trivy - vulnerabilidades de la imagen (rompe si HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: todo-secure:ci
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
      - name: Trivy - mala configuracion de IaC (Dockerfile/compose)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: 'HIGH,CRITICAL'

  # ---------------------------------------------------------------------------
  # 5) DAST - analisis dinamico contra la app en marcha (OWASP ZAP)
  # ---------------------------------------------------------------------------
  dast:
    name: DAST - OWASP ZAP baseline
    runs-on: ubuntu-latest
    needs: [container]
    # DAST es informativo: la red entre el contenedor de ZAP y el de la app puede
    # requerir configuracion adicional en CI, por lo que el job no bloquea el pipeline.
    # ZAP tambien puede ejecutarse en local contra http://localhost:3000.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Levantar la app (red host para que ZAP la alcance)
        run: |
          docker build -t todo-secure:ci .
          docker run -d --name todo --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e SESSION_SECRET=ci-secret-suficientemente-largo-para-zap-123456 \
            todo-secure:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health >/dev/null; then echo "app lista"; break; fi
            sleep 2
          done
      - name: ZAP Baseline (DAST pasivo)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-I'
