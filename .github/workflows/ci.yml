name: CI

# Pipeline de Integracion Continua (S-SDLC: fase de Pruebas/Despliegue).
# Ejecuta verificacion estatica, pruebas (incl. seguridad), auditoria de
# dependencias y construccion de la imagen Docker en cada push y PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Lint, test y auditoria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Comprobacion de sintaxis (lint)
        run: npm run lint

      - name: Pruebas (unitarias + seguridad)
        run: npm test
        env:
          NODE_ENV: test
          SESSION_SECRET: ci-secret-suficientemente-largo-para-los-tests

      - name: Auditoria de dependencias (SCA)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen (sin publicar)
        run: docker build -t todo-secure:ci .
