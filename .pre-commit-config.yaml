# Hooks de pre-commit: "shift-left" en la maquina del desarrollador, ANTES del commit.
# Instalacion:  pip install pre-commit && pre-commit install
# Ejecucion manual sobre todo el repo:  pre-commit run --all-files
#
# Decision DevSecOps: detectar secretos y errores de higiene en el commit local es la
# barrera mas barata y temprana del ciclo (NIST SSDF PS.1 / PW.5).

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: ["--config", "security/.gitleaks.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
